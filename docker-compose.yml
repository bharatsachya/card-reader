# Card Reader — colocated with Ollama on one EC2 box.
#
#   docker compose up -d --build
#
# Ollama is NOT a service here. It runs as a host systemd unit, already
# installed, bound to 127.0.0.1:11434. That is deliberate and is the whole
# reason for network_mode: host below.

services:
  app:
    build: .
    restart: unless-stopped

    # HOST NETWORKING, AND THIS IS THE ONE DECISION TO UNDERSTAND HERE.
    #
    # Ollama listens on 127.0.0.1:11434 only. A container on the default bridge
    # network has its OWN loopback, so `127.0.0.1` inside the container means
    # the container itself, not the host -- the request would connect to
    # nothing. The usual workaround, extra_hosts: host.docker.internal:
    # host-gateway, does not help either: traffic then arrives at the host from
    # the docker bridge subnet (172.17.x.x), and Ollama bound to 127.0.0.1
    # refuses it.
    #
    # The two ways out are to rebind Ollama to 0.0.0.0 -- which puts an
    # unauthenticated inference endpoint on the box's network interface, the
    # exact thing colocating was meant to avoid -- or to share the host's
    # network namespace. This does the second. The container's 127.0.0.1 IS the
    # host's, Ollama stays bound to loopback and is unreachable from the
    # internet, and no card image ever leaves the machine.
    #
    # The cost is that port mapping no longer applies: the app binds the host's
    # :8000 directly. nginx in front then owns :80. That is acceptable on a
    # single-purpose box and is why there is no `ports:` key.
    network_mode: host

    env_file:
      - .env
    environment:
      MODEL_URL: http://127.0.0.1:11434/v1/chat/completions
      MODEL_NAME: qwen2.5vl:3b
      DB_PATH: /app/data/leads.db
      IMAGE_DIR: /app/data/images
      STORE_BACKEND: sqlite
      # Bound above the slowest measured card with real headroom. A timeout
      # mid-card discards every second already spent on it, so erring long is
      # much cheaper than erring short.
      MODEL_TIMEOUT_SECONDS: "600"
      # A review window, not a product. 7 days of images at the measured
      # ceiling (~500 cards/day absolute max) is well under 1 GB.
      IMAGE_RETENTION_DAYS: "7"
      # Single replica, so this is safe and is what stops a job killed by a
      # restart from polling forever.
      RECLAIM_STALE_JOBS: "true"
      # Clerk stays wired and documented but OFF -- a reviewer told the URL is
      # public must not meet a signup wall. See the README.
      AUTH_MODE: local
      PORT: "8000"

    volumes:
      # Named, not a bind mount: a bind mount inherits the host directory's
      # uid, which is not the container's 10001, and the app then cannot write
      # -- surfacing as "unable to open database file".
      - card-data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  card-data:
