# nginx in front of Card Reader.
#
#   sudo cp deploy/nginx-card-reader.conf /etc/nginx/sites-available/card-reader
#   sudo ln -sf /etc/nginx/sites-available/card-reader /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is a Let's Encrypt certificate for 51.20.232.225.sslip.io -- see
# deploy/enable-tls.sh for why that hostname and not the bare IP.

# --------------------------------------------------------------------------
# Port 80: redirect to HTTPS, except the ACME challenge.
# --------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name 51.20.232.225.sslip.io 51.20.232.225 _;

    # THIS LOCATION IS WHY PORT 80 STAYS OPEN IN THE SECURITY GROUP.
    #
    # Let's Encrypt verifies control of the name by fetching a token over
    # plain HTTP from this path. Close port 80 and renewal fails -- not today,
    # but ~60 days from now when the certificate expires and the site goes
    # down for a reason disconnected from the change that caused it. It must
    # come BEFORE the redirect below, or the challenge gets 301'd to HTTPS and
    # the validation fails.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # REDIRECT TO THE CANONICAL HOSTNAME, NOT $host.
    #
    # certbot's generated redirect uses https://$host$request_uri, which sends
    # someone who typed the bare IP to https://51.20.232.225/ -- where the
    # certificate is issued for the sslip.io name, so the browser shows a
    # name-mismatch warning. Naming the host explicitly means every route in
    # lands on a URL the certificate actually covers.
    location / {
        return 301 https://51.20.232.225.sslip.io$request_uri;
    }
}

# --------------------------------------------------------------------------
# Port 443: the application.
# --------------------------------------------------------------------------
server {
    # `listen ... http2` rather than the separate `http2 on;` directive:
    # Ubuntu 24.04 ships nginx 1.24, and `http2 on;` only exists from 1.25.1.
    # The newer form fails config validation with "unknown directive".
    listen 443 ssl http2;
    server_name 51.20.232.225.sslip.io 51.20.232.225 _;

    ssl_certificate     /etc/letsencrypt/live/51.20.232.225.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/51.20.232.225.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # THE SETTING THAT MATTERS MOST ON THIS BOX.
    #
    # nginx's default proxy_read_timeout is 60 SECONDS. A card takes 136-172s,
    # so with the default EVERY extraction dies at 60s and the browser is told
    # 504. The symptom points at the model -- "the model timed out" -- and the
    # model is fine; nginx killed a healthy request. This is the single most
    # likely way this deployment breaks, and every layer looks correct in
    # isolation while it does.
    #
    # 900s sits above MODEL_TIMEOUT_SECONDS=600 so the app's own timeout always
    # fires first. That ordering matters: the app turns a timeout into a
    # flagged row with a reason, while nginx turns it into an opaque 504 that
    # loses the whole batch's response.
    proxy_read_timeout    900s;
    proxy_send_timeout    900s;
    proxy_connect_timeout 30s;

    # 20 files x 15 MB, plus multipart overhead. nginx's default is 1 MB, which
    # would reject a single phone photo with a 413 before the app sees it.
    client_max_body_size 320m;
    client_body_timeout  300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The app is behind TLS termination, so without this it would believe
        # every request arrived over plain http.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering off: the app streams uploads to disk with the size cap
        # enforced mid-stream. With buffering on, nginx would first write the
        # whole 300 MB body to its own temp directory before forwarding a byte,
        # doubling disk traffic and defeating early rejection of a large file.
        proxy_request_buffering off;
    }
}
