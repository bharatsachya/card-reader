# nginx in front of Card Reader.
#
#   sudo cp deploy/nginx-card-reader.conf /etc/nginx/sites-available/card-reader
#   sudo ln -sf /etc/nginx/sites-available/card-reader /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;

    # Both names on purpose. The bare IP is how the box is reached directly;
    # the sslip.io name is what a TLS certificate can actually be issued FOR,
    # because a public CA will not sign a certificate for a raw IP address.
    # sslip.io resolves any <ip>.sslip.io straight back to that IP, so this is
    # a real hostname pointing at this machine with no domain to buy and no DNS
    # to manage. certbot needs server_name to match the name it is issuing for,
    # or it cannot find the block to edit.
    server_name 51.20.232.225.sslip.io 51.20.232.225 _;

    # THE SETTING THAT MATTERS MOST ON THIS BOX.
    #
    # nginx's default proxy_read_timeout is 60 SECONDS. A card takes 136-172s,
    # so with the default EVERY extraction dies at 60s and the browser is told
    # 504. The symptom points at the model -- "the model timed out" -- and the
    # model is fine; nginx killed a healthy request. This is the single most
    # likely way this deployment breaks, and it breaks silently in the sense
    # that every layer looks correct in isolation.
    #
    # 900s matches MODEL_TIMEOUT_SECONDS=600 with headroom, so the app's own
    # timeout is always the one that fires first. That ordering matters: the
    # app turns a timeout into a flagged row with a reason, while nginx turns
    # it into an opaque 504 that loses the whole batch's HTTP response.
    proxy_read_timeout    900s;
    proxy_send_timeout    900s;
    proxy_connect_timeout 30s;

    # 20 files x 15 MB, plus multipart overhead. nginx's default is 1 MB, which
    # would reject a single phone photo with a 413 before the app ever sees it.
    client_max_body_size 320m;
    client_body_timeout  300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering off: the app streams uploads to disk with the size cap
        # enforced mid-stream. With buffering on, nginx would first write the
        # whole 300 MB body to its own temp directory before forwarding a byte,
        # which both doubles the disk traffic and defeats the early rejection
        # of an oversized file.
        proxy_request_buffering off;
    }
}
