[pytest]
testpaths = tests

# Put the project root on sys.path so `from app...` resolves.
#
# WHY THIS IS NEEDED AT ALL: `python -m pytest` silently prepends the working
# directory to sys.path, but the bare `pytest` entry point does NOT. So a suite
# can pass locally for months and fail on the first CI run with
# ModuleNotFoundError -- which is exactly what happened here. Declaring it
# makes both invocations behave identically.
pythonpath = .
# Without this, pytest-asyncio SKIPS every async test with a warning rather
# than failing -- which is indistinguishable from a passing suite at a glance.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning:app.*
