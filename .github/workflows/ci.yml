name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first run still in flight.
# Without this, pushing three fixes in a minute queues three full builds and
# the answer you care about is the last one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile and the development environment. Testing on
          # a different minor than you ship is how a version-specific failure
          # reaches production with a green tick behind it.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Lint first: it takes a second and its failures are the cheapest to fix.
      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .
        # Formatting is advisory here because the codebase was hand-formatted
        # before ruff arrived; a hard failure would demand reformatting every
        # file in one unreviewable commit.
        continue-on-error: true

      - name: Test
        run: pytest -q
        env:
          # Explicit rather than inherited, so a change to the default backend
          # cannot silently alter what CI exercises.
          STORE_BACKEND: memory
          AUTH_MODE: local

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true          # keep it locally so the smoke test below can run
          tags: card-reader:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that succeeds proves the image assembles, not that it RUNS.
      # These two checks cost seconds and catch the failures that actually
      # happen: a missing runtime library, a permissions mistake on the data
      # directory, an entrypoint that exits immediately.
      - name: Smoke test the image
        run: |
          docker run -d --name cr -p 8000:8000 \
            -e STORE_BACKEND=sqlite -e AUTH_MODE=local card-reader:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          echo "--- /health ---"
          curl -fsS localhost:8000/health | python3 -m json.tool
          echo "--- the app must NOT be running as root ---"
          test "$(docker exec cr id -u)" != "0"
          echo "--- and must be able to write its database ---"
          docker exec cr test -w /app/data
          docker rm -f cr
